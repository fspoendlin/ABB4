defaults:
  - data
  - interpolant
  - model
  - experiment
  - _self_
  
# override/add the following config entries
data:

  module:
    inference_only_mode: True
    loaders:                                # DataLoader class
      num_workers: 10                       # per dataloader (one dataloader per GPU, train, val and test)
      prefetch_factor: 10             # number of batches to prefetch

  dataset:
    predict:
        num_samples: 250  # 250        # number of samples to generate for each input sequence
        csv_path: /ceph/opig-shared/users/spoendli/conformation_prediction/conformation_prediction/data/datasets/sabdab_scfvs_in_trainset_expressed_in_ecoli.csv
        # /ceph/opig-shared/users/spoendli/conformation_prediction/conformation_prediction/data/datasets/sabdab_scfvs_selected_for_nmr.csv
        pred_sampler:
          batch_size: 75

interpolant:
  load_dataset_csv: False
  csv_path: null
  max_resolution: null
  sampling:
    num_timesteps: 100
               
experiment:
  num_devices: 4 #4
  prediction:
    save_traj: False
    save_int_traj: False # False
    output_dir: /ceph/opig-shared/projects/spoendlin-EnsemblePrediction/nmr_exp/sabdab_scfvs_in_trainset_expressed_in_ecoli/predictions_raw/
    # /ceph/opig-shared/projects/spoendlin-EnsemblePrediction/nmr_exp/sabdab_scfvs/predictions_raw/
    ckpt_path: ckpt/abb4_STEROIDS/abb4_STEROIDS.ckpt

  checkpointer:
    dirpath: ckpt/${experiment.wandb.project}/${experiment.wandb.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    save_last: True
    save_top_k: 5 #10
    # every_n_train_steps: 1
    every_n_epochs: null
    save_on_train_epoch_end: False
    monitor: valid/h_cdr3_d_mean_rmsd_sims
    mode: min
