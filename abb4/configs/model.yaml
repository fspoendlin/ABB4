model:
  task: ${data.task}
  node_embed_size: 256                      # node feature dimensionality
  edge_embed_size: 256                      # edge feature dimensionality
  aatype_pred_num_tokens: 21                # 20 amino acids + MASK token
  transformer_dropout: 0.2                  # dropout in the sequence Transformer (not IPA)

  node_features:
    task: ${model.task}
    c_s: ${model.node_embed_size}
    c_pos_emb: 128                          # IMGT positional embedding dimensionality
    c_timestep_emb: 128                     # timestep embedding dimensionality
    aatype_pred_num_tokens: ${model.aatype_pred_num_tokens}
    embed_imgt_numeric: False
    embed_region: True                      # embed CDR/FW region labels as node features
    self_condition: ${model.edge_features.self_condition}

  edge_features:
    c_s: ${model.node_embed_size}
    c_p: ${model.edge_embed_size}
    feat_dim: 64
    num_bins: 22                            # number of distance bins for pairwise features
    self_condition: False                   # include previous-step Cα distogram in edge features (stochastic, 50% of batches)

  ipa:
    c_s: ${model.node_embed_size}
    c_z: ${model.edge_embed_size}
    c_hidden: 16
    no_heads: 12                            # IPA attention heads
    no_qk_points: 4
    no_v_points: 8
    seq_tfmr_num_heads: 4                   # sequence Transformer attention heads
    seq_tfmr_num_layers: 2                  # sequence Transformer layers per IPA block
    num_blocks: 8                           # number of IPA blocks
    dropout: 0.1                            # dropout in IPA (not the sequence Transformer)

  torsion_angles:
    c_in: ${model.node_embed_size}
    c_hidden: 256                           # hidden dimension for torsion angle prediction MLP
    no_angles: 7                            # number of torsion angles predicted per residue
