data:

  task: fwd_fold                            # in {cogen, fwd_fold, inv_fold}
  gen_extent: full                          # in {full, partial}; partial is not currently supported
  gen_regions:                              # regions to generate; only used if gen_extent == partial
    - H: ['fw1', 'cdr1', 'fw2', 'cdr2', 'fw3', 'cdr3', 'fw4']
    - L: ['fw1', 'cdr1', 'fw2', 'cdr2', 'fw3', 'cdr3', 'fw4']

  module:
    gen_extent: ${data.gen_extent}
    gen_regions: ${data.gen_regions}
    inference_only_mode: False              # True for inference, False for training/validation/testing
    loaders:
      num_workers: 10                       # CPU workers per dataloader (one per GPU, for train/val/test)
      prefetch_factor: 10                   # number of batches to prefetch per worker
      persistent_workers: False

  dataset:

    train_val_test_pdbs:                    # shared filters applied to train/val/test splits
      csv_path: data/localpaths/ABB3_latest_CDRsim_metadata_random.csv
      min_num_res: 0                        # minimum residues per structure; 0 disables
      max_num_res: 10000                    # maximum residues per structure; 10000 disables
      max_resolution: 3.5
      subset: null                          # limit to first k structures; null uses all

    train:
      dataset:
        gen_extent: ${data.gen_extent}
        gen_regions: ${data.gen_regions}
        sim_proba_sampling: False           # sample frames weighted by simulation probability
        sim_proba_sampling_mode: sample     # sample from probability distribution (train mode)
        ot: ${interpolant.ot}
        rots_dist: ${interpolant.rots.dist}
        ensemble_size: 10                   # frames per structure; keep small during training (gradients computed over ensemble)

      single_struc: True
      single_struc_sampler:
        batch_size: 10                      # per-GPU batch size; reduce if OOM
        shuffle: True
        num_struc_samples: null             # limit to first k structures; null uses all
        drop_last: True                     # drop incomplete final batch

      ensemble: False                       # run sampling-based validation during training (expensive)
      ensemble_sampler:
        batch_size: 1                       # must be 1; ensemble_size drives memory usage
        shuffle: True

    valid:
      dataset:
        gen_extent: ${data.gen_extent}
        gen_regions: ${data.gen_regions}
        sim_proba_sampling: False
        sim_proba_sampling_mode: highest    # always select the highest-probability frame (deterministic across epochs)
        ot: ${interpolant.ot}
        rots_dist: ${interpolant.rots.dist}
        ensemble_size: 50                   # frames per structure; larger is fine (no gradients)

      single_struc: False                   # run train-like loss computation as validation
      single_struc_sampler:
        batch_size: 10
        shuffle: False
        num_struc_samples: null
        drop_last: False

      ensemble: True                        # run sampling-based validation and compute ensemble metrics
      ensemble_sampler:
        batch_size: 1                       # must be 1
        shuffle: True

    extra_valid:
      use_extra: ${experiment.validation.extra_validation}
      dataset:
        gen_extent: ${data.gen_extent}
        gen_regions: ${data.gen_regions}
        sim_proba_sampling: False
        sim_proba_sampling_mode: highest
        ot: ${interpolant.ot}
        rots_dist: ${interpolant.rots.dist}
        ensemble_size: 30

      single_struc: False
      single_struc_sampler:
        batch_size: 10
        shuffle: False
        num_struc_samples: null
        drop_last: False

      ensemble: True
      ensemble_sampler:
        batch_size: 2
        shuffle: True

    test:
      dataset:
        gen_extent: ${data.gen_extent}
        gen_regions: ${data.gen_regions}
        sim_proba_sampling: False
        sim_proba_sampling_mode: highest    # always select the highest-probability frame
        ot: ${interpolant.ot}
        rots_dist: ${interpolant.rots.dist}
        ensemble_size: 10

      single_struc: False                   # run train-like loss computation at test time
      single_struc_sampler:
        batch_size: 10
        shuffle: False
        num_struc_samples: null
        drop_last: False

      ensemble: True                        # run sampling-based evaluation and compute ensemble metrics
      ensemble_sampler:
        batch_size: 1                       # must be 1
        shuffle: False

    extra_test:
      use_extra: ${experiment.testing.extra_validation}
      dataset:
        gen_extent: ${data.gen_extent}
        gen_regions: ${data.gen_regions}
        sim_proba_sampling: False
        sim_proba_sampling_mode: highest
        ot: ${interpolant.ot}
        rots_dist: ${interpolant.rots.dist}
        ensemble_size: 30

      single_struc: False
      single_struc_sampler:
        batch_size: 10
        shuffle: False
        num_struc_samples: null
        drop_last: False

      ensemble: True
      ensemble_sampler:
        batch_size: 2
        shuffle: False

    predict:
      num_samples: null                     # number of structures to generate per input sequence
      csv_path: null

      pred_sampler:
        batch_size: null
