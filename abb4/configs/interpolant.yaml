interpolant:
  task: ${data.task}
  gen_extent: ${data.gen_extent}
  separate_t: False                         # sample independent t values for sequence and structure modalities
  fwd_fold_prob: 1                          # probability of pure forward folding per sample (t_seq=1); requires separate_t=True
  inv_fold_prob: 0                          # probability of pure inverse folding per sample (t_struc=1); requires separate_t=True
  self_condition: ${model.edge_features.self_condition}
  min_t: 1e-2                               # timesteps sampled uniformly in [min_t, 1-min_t]
  zero_t: False                             # force t=0 for all samples (debugging only)
  shared_t: True                            # use the same t for all samples in a batch
  load_dataset_csv: True                    # set False for inference to skip loading train/val/test CSV
  csv_path: ${data.dataset.train_val_test_pdbs.csv_path}
  max_resolution: ${data.dataset.train_val_test_pdbs.max_resolution}

  ot:
    use_ot: True                            # use optimal transport for noise matching
    ot_mode: dataset                        # in {dataset, batch}; dataset computes OT over full dataset, batch over minibatch
    ot_dataset_col: aa_seq                  # dataset CSV column used for OT distance; in {aa_seq, seq_len}
    ot_max_samples: 50                      # maximum samples used for dataset-mode OT
    ot_fn: emd                              # OT solver; only emd is implemented
    ot_distance: se3                        # distance metric for OT cost; in {se3, so3, r3}
    so3_weight: 10.0                        # relative weight of SO(3) vs R3 in SE(3) distance

  rots:
    train_schedule: linear                  # noise schedule during training; in {linear, exp, pow}
    train_exp_rate: 2
    power: 1.48                             # exponent for pow schedule; t^power
    sample_schedule: exp                    # noise schedule during sampling; in {linear, exp, pow}
    sample_exp_rate: 10
    dist: USO3                              # noise distribution; in {USO3, IGSO3}

  trans:
    train_schedule: linear                  # noise schedule during training; in {linear, exp, pow}
    train_exp_rate: 2
    power: 1.48                             # exponent for pow schedule
    sample_schedule: linear                 # noise schedule during sampling; only linear implemented
    sample_exp_rate: 10

  aatypes:
    interpolant_type: masking               # in {masking, uniform}
    do_purity: True                         # use purity sampling; requires interpolant_type=masking
    noise: 20.0                             # stochasticity parameter eta for CTMC
    temp: 0.1                               # softmax temperature during sampling
    train_schedule: linear                  # in {linear}; only linear implemented
    sample_schedule: linear                 # in {linear}; only linear implemented

  sampling:
    num_timesteps: 10                       # ODE steps during inference; 100 for publication accuracy, 50 for ~2x speedup
