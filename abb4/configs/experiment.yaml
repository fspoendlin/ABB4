experiment:
  debug: False
  num_devices: 1                            # number of GPUs for DDP training
  warm_start_cfg_override: False            # if True, override this config with the checkpoint config
  warm_start: null                          # path to directory containing trvalte_config.yaml for warm-start
  load_all_states: False                    # False: load weights only; True: restore full training state
  warm_start_weights: null                  # path to checkpoint .ckpt file for warm-start
  crash_dir: null                           # directory to dump debug info on crash

  training: &training_config
    loss: tot_loss                          # loss term to optimise; tot_loss is the weighted sum of all active terms
    training_losses:
      crash_dir: ${experiment.crash_dir}
      t_normalize_clip: 0.9                 # clip loss normaliser 1/(1-min(t, 0.9))
      bb_atom_scale: 0.1                    # scale factor applied to coordinates before loss (coords in Å)
      trans_scale: 0.1                      # scale factor applied to translations before loss (translations in Å)

      # time-step loss weighting
      loss_t_weighting: null                # in {null, exp}; null disables; exp upweights early timesteps
      loss_t_weighting_exp_rate: 1.39       # exp rate; 1.39 gives 2× weight to first vs third interval

      # flow matching losses
      translation_loss_weight: 8
      rotation_loss_weight: 0.8
      aatypes_loss_weight: 0
      aatypes_loss_use_likelihood_weighting: False  # apply 1/(1-cat_t) weight to cross-entropy

      # auxiliary structural losses (disabled by default)
      bb_loss_weight: 0
      bb_loss_t_pass: 0                     # only apply loss for t > t_pass

      pair_loss_weight: 0
      pair_loss_t_pass: 0

      A_fape_loss_weight: 0.08              # all-atom FAPE loss
      A_fape_loss_t_pass: 0
      cdr_fw_fape_weight: 1

      BB_fape_loss_weight: 0                # backbone-only FAPE loss
      BB_fape_loss_t_pass: 0
      BB_fape_cdr_weighting: True           # upweight CDR residues in BB FAPE loss

      torsion_loss_weight: 0.4
      torsion_loss_t_pass: 0

      torsion_norm_loss_weight: 0.02        # penalty for non-unit torsion vectors
      torsion_norm_t_pass: 0

      dist_loss_weight: 0
      dist_loss_t_pass: 0

      angle_loss_weight: 0
      angle_loss_t_pass: 0

      clashes_loss_weight: 0
      clashes_loss_t_pass: 0

      # RMSF ensemble loss
      rmsf_loss: chi2                       # in {standard_mse, chi2}
      rmsf_loss_region: all                 # in {cdrs, cdrh3, all}
      rmsf_loss_weight: 0                   # set > 0 to enable
      rmsf_loss_t_pass: 0                   # only apply loss for t > t_pass
      rmsf_loss_model_variance: 0.10        # estimated model variance as a fraction of RMSF
      rmsf_loss_sampling_var_weight: 0      # weight of sampling variance in chi2 denominator
      rmsf_loss_model_var_weight: 1         # weight of model variance in chi2 denominator

  validation:
    <<: *training_config
    step_validation: True
    sample_validation: True                 # run full reverse-diffusion sampling during validation
    extra_validation: False                 # use an additional validation set (e.g. CG set for AA training)
    sample_every_n_epochs: 1000000
    save_sampled_strucs: False              # save sampled structures as PDB and pkl files
    save_traj: False
    save_int_traj: False
    training_losses: ${experiment.training.training_losses}

  testing:
    <<: *training_config
    ckpt_name: last.ckpt                    # checkpoint filename to load from checkpointer.dirpath
    step_validation: True
    sample_validation: True                 # run full reverse-diffusion sampling during testing
    extra_validation: False                 # use an additional test set
    save_sampled_strucs: False              # save sampled structures as PDB and pkl files
    training_losses: ${experiment.training.training_losses}

  prediction:
    save_traj: null
    save_int_traj: null
    output_dir: null                        # directory to write generated PDB files
    ckpt_path: null                         # path to checkpoint to use for inference

  optimizer:
    which: AdamW                            # in {RAdam, AdamW}
    lr: 1e-5
    weight_decay: 1e-2

  lr_scheduler:
    use: warmup_cosine_annealing_no_restart # in {false, reduce_on_plateau, cosine_annealing, cosine_annealing_no_restart, warmup_cosine_annealing_no_restart}
    T_max: 100                              # period for cosine_annealing_no_restart / warmup_cosine_annealing_no_restart
    eta_min: 1e-6                           # minimum LR at the end of cosine schedule
    warmup_start_factor: 0.01              # initial LR = lr * warmup_start_factor
    warmup_end_factor: 1.0                 # LR at end of warmup = lr * warmup_end_factor
    warmup_epochs: 10
    interval: epoch
    frequency: 1
    strict: False

  trainer:
    overfit_batches: 0                      # set to non-zero to sanity-check model capacity
    min_epochs: 1
    max_epochs: 5000
    accelerator: gpu
    log_every_n_steps: 1
    deterministic: False                    # allow non-deterministic CUDA ops for performance
    strategy: ddp_find_unused_parameters_true
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 5              # effective batch size = batch_size * num_devices * accumulate_grad_batches

  wandb: null                               # set to null to disable W&B logging
    # name: ${now:%Y-%m-%d}_${now:%H-%M-%S}
    # save_dir: ./logs
    # project: "project"
    # entity: "username"
    # group: "group_name"
    # save_code: True
    # tags: []

  checkpointer:
    dirpath: ckpt/${now:%Y-%m-%d}_${now:%H-%M-%S}
    save_last: True
    save_top_k: 5
    every_n_epochs: 1
    save_on_train_epoch_end: False
    monitor: valid/h_cdr3_d_mean_rmsd_sims  # checkpoint saved on minimum CDR H3 RMSD
    mode: min
